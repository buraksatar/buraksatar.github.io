# Questions people actually type, answered in full sentences that stand on their
# own. Rendered on /about/ by _includes/faq.html, which also emits FAQPage
# JSON-LD from this same list.
#
# Rules for adding one:
#   - The question must be a real query, not a heading.
#   - The answer must make sense quoted with nothing around it: name the
#     benchmark, the venue and the number rather than saying "our work" or "as
#     shown above".
#   - Every claim must already be published. This file is not a place for new
#     results.

- q: "Are vision-language models biased against non-Western cultures?"
  a: >-
    Yes, and it is measurable. Vision-language models learn from web data, which
    over-represents Western scenes. On the Seeing Culture benchmark (EMNLP 2025),
    built across seven Southeast Asian countries, GPT-o3 answers 91% of
    across-culture questions correctly but never exceeds 32.5 mean IoU when asked
    to point to the artifact it just reasoned about: accurate in words, wrong in
    what it looks at.

- q: "How do you measure whether a vision-language model actually understands a cultural scene?"
  a: >-
    Ask it to show its work. Seeing Culture (EMNLP 2025) pairs every culturally
    grounded question with a segmentation mask, so the model must answer and then
    ground that answer in the image. Cultural Moment (EMNLP 2026, oral) extends the
    idea to video and scores naming, recognition and temporal localization as
    three separate abilities.

- q: "What benchmarks exist for cultural understanding in Southeast Asia?"
  a: >-
    Seeing Culture (EMNLP 2025) covers 138 cultural artifacts from seven Southeast
    Asian countries; Cultural Moment (EMNLP 2026, oral) covers 306 expert-curated
    concepts across 624 videos in the same countries. Both are public on Hugging
    Face under Multimedia-SMU. SEA-VL (ACL 2025) and SEACrowd (EMNLP 2024) add
    large-scale regional image and language data.

- q: "Is one annotator from Southeast Asia enough to build a cultural benchmark?"
  a: >-
    No. The 14-rater human study in Cultural Moment (EMNLP 2026, oral) shows that
    the knowledge these tasks require is country-specific rather than regional, so
    a rater from one Southeast Asian country is not a proxy for the others.
    Cultural benchmarks need annotators from each culture they represent.

- q: "Who is Burak Satar?"
  a: >-
    I am a Research Scientist at Singapore Management University, working with
    Prof Chong-Wah Ngo on culturally-aware vision-language models for Southeast
    Asia. I lead Cultural Moment (EMNLP 2026, oral) and am co-first author of
    Seeing Culture (EMNLP 2025). I am open to research collaborations, student
    internships at SMU, and talks on cultural AI evaluation.

# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "burak" # Custom theme: _sass/theme/_burak_{tokens,light,dark}.scss
                                   # Upstream also ships "default", "air", "sunrise", "mint", "dirt", "contrast"
title                    : "Burak Satar"
title_separator          : "-"
name                     : &name "Burak Satar"
description              : &description "Burak Satar is a Research Scientist at Singapore Management University working on culturally-aware vision-language models, with a focus on Southeast Asia."
url                      : https://buraksatar.github.io # The base hostname & protocol for your site e.g. "https://[your GitHub username].github.io",
                                                           # or if you already have some other page hosted on Github then use "https://[your GitHub username].github.io/[Your Repo Name]"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "buraksatar/buraksatar.github.io"

# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  # Biographic information
  avatar           : "burak-satar-400.webp"
  name             : "Burak Satar"
  pronouns         : # example: "she/her"  
  bio              : "Making vision-language models culturally aware at SMU, \\PhD graduate from NTU."
  #location         : "Singapore"
  employer         : "Singapore Management University"
  uri              : # URL
  email            : "buraks@smu.edu.sg"
  #cv               : "/files/cv.pdf" # sidebar Download CV link (custom)
  calendly         : "https://calendly.com/buraks-smu" # sidebar links to /meeting/ (custom)

  # Academic websites
  academia         : # URL
  arxiv            : # URL - Update with the correct link to your profile
  googlescholar    : "https://scholar.google.com/citations?user=qSgpP04AAAAJ"
  inspire-hep      : # URL
  impactstory      : # URL
  # orcid            : "https://orcid.org/0000-0003-2850-7367"
  huggingface      : "Multimedia-SMU" # sidebar Hugging Face link (custom)
  semantic         : # URL - add your Semantic Scholar author page here
  ssrn             : # URL
  pubmed           :
  researchgate     : # URL
  scopus           : # URL
  zotero           : # URL


  # Repositories and software development
  bitbucket        : # Username - Update with your username on the site
  codepen          : # Username
  dribbble         : # Username
  github           : "buraksatar"
  kaggle           : # Username  
  stackoverflow    : # User number or user number and name (i.e., use "1" or "1/jeff-atwood")    

  # Social media
  artstation       : # Username
  bluesky          :
  facebook         : # Username
  flickr           : # Username
  foursquare       : # Username
  goodreads        : # Username
  google_plus      : # Username
  keybase          : # Username
  instagram        : "ehadibakalim"
  lastfm           : # Username
  linkedin         : "buraksatar"
  mastodon         : # URL
  medium           : # URL
  pinterest        : # Username
  soundcloud       : # Username
  steam            : # Username
  telegram         : # URL
  tumblr           : # Username
  twitter          : "hadibakalim"
  vine             : # Username
  weibo            : # Username
  wikipedia        : # Username
  xing             : # Username
  youtube          : # Username
  zhihu            : # Username

# Publications are grouped by research theme, not by publication type.
# See _data/research_themes.yml and the `theme:` key in _publications/*.md.

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/ for social media previews
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : false
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false      #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
atom_feed:
  hide                   : false     # change to true to hide the RSS feed in the footer
  path                   : # blank (default) uses feed.xml


# SEO Related
google_site_verification : j6ETNwmLw95wZL6kD0cOQ2lzq360hDQl-DJuDlweSJY
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               : &twitter "hadibakalim"
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "og-card.png"  # Social media default site image (1200x630, in /images/)
og_description           : *description
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles
    - "https://scholar.google.com/citations?user=qSgpP04AAAAJ"
    - "https://www.linkedin.com/in/buraksatar/"
    - "https://github.com/buraksatar"
    - "https://twitter.com/hadibakalim"
    - "https://orcid.org/0000-0003-2850-7367"
    - "https://huggingface.co/datasets/Multimedia-SMU/seeingculture-benchmark"


# Visitor map widget in the footer (mapmyvisitors.com). Create a widget for this
# site in the MapMyVisitors dashboard, then paste the values from the embed
# snippet: id is the short code in the /web/ link, d is the long key.
# cl is the landmass colour on the widget's own blue card; blank it to hide the
# map without touching the template.
mapmyvisitors:
  id               : "1c6jj"
  d                : "U9EdoERBMjWbx0dtCcwdYMtW9DemMiY6dQDklIgdvu4"
  cl               : "ffffff"

# Analytics
analytics:
  provider               :  "custom" # custom = GoatCounter, see _includes/analytics-providers/custom.html
  google:
    tracking_id          :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - markdown_generator
  - docker-compose.yaml
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - scripts
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# These settings control the types of collections used by the template
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/


# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Asia/Singapore # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
# Taxonomy archives are disabled: there are no /categories/ or /tags/ index pages,
# so leaving `type` set made every tag on a post render a link to a 404.
# _includes/page__taxonomy.html guards on `type`, so blanking it removes the links.
# Tags stay in post front matter; re-enable once the blog justifies an archive page.
category_archive:
  type:
  path: /categories/
tag_archive:
  type:
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
